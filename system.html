<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Robotech Digital Solutions — Business Management &amp; Operations System</title>
<meta name="description" content="Business Management & Operations System for Robotech Digital Solutions — cyber services, printing, branding and digital technology." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ROBOTECH DIGITAL SOLUTIONS — DESIGN SYSTEM
   ============================================================ */
:root{
  /* Brand */
  --brand-950:#061530;
  --brand-900:#0A2247;
  --brand-800:#0E2E60;
  --brand-700:#123C7E;
  --brand-600:#174EA6;
  --brand-500:#2563EB;
  --brand-200:#C3D5F5;
  --brand-100:#E7EEFB;
  --brand-50:#F2F6FD;

  /* Neutrals */
  --bg:#F4F6FA;
  --surface:#FFFFFF;
  --surface-2:#FAFBFD;
  --border:#E3E8F0;
  --border-strong:#CFD8E6;
  --text:#0F1B2D;
  --text-2:#4A5A72;
  --text-3:#7A889E;

  /* Semantic */
  --green:#15803D; --green-bg:#E8F6EC; --green-br:#BBE6C9;
  --orange:#B45309; --orange-bg:#FEF3E2; --orange-br:#F7D9A8;
  --red:#B91C1C; --red-bg:#FDECEC; --red-br:#F5C2C2;
  --blue:#174EA6; --blue-bg:#E7EEFB; --blue-br:#C3D5F5;
  --gray:#475569; --gray-bg:#EEF1F6; --gray-br:#D8DEE9;

  /* Shape */
  --radius-sm:8px;
  --radius:12px;
  --radius-lg:16px;
  --shadow-xs:0 1px 2px rgba(15,27,45,.06);
  --shadow-sm:0 1px 3px rgba(15,27,45,.08), 0 1px 2px rgba(15,27,45,.04);
  --shadow:0 6px 20px rgba(15,27,45,.09);
  --shadow-lg:0 20px 48px rgba(10,34,71,.22);

  --sidebar-w:266px;
  --sidebar-w-collapsed:78px;
  --topbar-h:66px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{ -webkit-text-size-adjust:100%; }
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
img,svg{display:block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#C9D3E2;border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#A9B7CC;background-clip:content-box;border:2px solid transparent}

/* ---------- Typography helpers ---------- */
.h1{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.h2{font-size:17px;font-weight:700;letter-spacing:-.015em}
.h3{font-size:15px;font-weight:600}
.muted{color:var(--text-3)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.strong{font-weight:600}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.ta-right{text-align:right}
.ta-center{text-align:center}
.nowrap{white-space:nowrap}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:38px;padding:0 15px;border-radius:9px;font-size:13.5px;font-weight:600;
  border:1px solid transparent;transition:background .15s,border-color .15s,box-shadow .15s,color .15s,transform .06s;
  white-space:nowrap;user-select:none;
}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px;flex:none}
.btn-primary{background:var(--brand-600);color:#fff;box-shadow:0 1px 2px rgba(23,78,166,.35)}
.btn-primary:hover{background:var(--brand-700)}
.btn-outline{background:#fff;border-color:var(--border-strong);color:var(--text)}
.btn-outline:hover{background:var(--brand-50);border-color:var(--brand-200);color:var(--brand-700)}
.btn-ghost{background:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--gray-bg);color:var(--text)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#991B1B}
.btn-danger-soft{background:var(--red-bg);color:var(--red);border-color:var(--red-br)}
.btn-danger-soft:hover{background:#FBD9D9}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover{background:#116632}
.btn-sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:8px}
.btn-sm svg{width:14px;height:14px}
.btn-lg{height:46px;padding:0 22px;font-size:15px;border-radius:10px}
.btn-icon{
  display:inline-flex;align-items:center;justify-content:center;
  width:38px;height:38px;border-radius:9px;color:var(--text-2);
  transition:background .15s,color .15s;flex:none;
}
.btn-icon:hover{background:var(--gray-bg);color:var(--text)}
.btn-icon svg{width:19px;height:19px}
.btn-icon.sm{width:30px;height:30px;border-radius:7px}
.btn-icon.sm svg{width:15px;height:15px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-block{width:100%}

/* ============================================================
   FORM CONTROLS
   ============================================================ */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:15px}
.field label{font-size:12.5px;font-weight:600;color:var(--text-2);letter-spacing:.01em}
.field .hint{font-size:11.5px;color:var(--text-3)}
.input,.select,.textarea{
  width:100%;height:40px;padding:0 12px;border:1px solid var(--border-strong);
  border-radius:9px;background:#fff;font-size:13.5px;color:var(--text);
  transition:border-color .15s,box-shadow .15s;outline:none;
}
.textarea{height:auto;min-height:88px;padding:10px 12px;resize:vertical;line-height:1.5}
.input:focus,.select:focus,.textarea:focus{border-color:var(--brand-500);box-shadow:0 0 0 3px rgba(37,99,235,.13)}
.input::placeholder,.textarea::placeholder{color:#9AA7BB}
.select{
  appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%237A889E' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 11px center;padding-right:34px;
}
.input-group{position:relative;display:flex;align-items:center}
.input-group svg{position:absolute;left:12px;width:17px;height:17px;color:var(--text-3);pointer-events:none}
.input-group .input{padding-left:37px}
.checkbox{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);cursor:pointer;user-select:none}
.checkbox input{width:16px;height:16px;accent-color:var(--brand-600);cursor:pointer}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}
.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.form-grid .span-2{grid-column:span 2}
.form-grid.three .span-2{grid-column:span 2}
.form-grid.three .span-3{grid-column:span 3}
@media(max-width:720px){
  .form-grid,.form-grid.three{grid-template-columns:1fr}
  .form-grid .span-2,.form-grid.three .span-2,.form-grid.three .span-3{grid-column:span 1}
}

/* ============================================================
   BADGES / PILLS
   ============================================================ */
.badge{
  display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;
  border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.01em;
  border:1px solid transparent;white-space:nowrap;
}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.badge-green{background:var(--green-bg);color:var(--green);border-color:var(--green-br)}
.badge-orange{background:var(--orange-bg);color:var(--orange);border-color:var(--orange-br)}
.badge-red{background:var(--red-bg);color:var(--red);border-color:var(--red-br)}
.badge-blue{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-br)}
.badge-gray{background:var(--gray-bg);color:var(--gray);border-color:var(--gray-br)}
.badge-purple{background:#F1EBFD;color:#6D28D9;border-color:#DDD0FA}

/* ============================================================
   CARDS
   ============================================================ */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow-xs);
}
.card-pad{padding:20px}
.card-head{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:16px 20px;border-bottom:1px solid var(--border);
}
.card-head .title{font-size:15px;font-weight:700;letter-spacing:-.01em}
.card-head .sub{font-size:12px;color:var(--text-3);margin-top:1px}
.card-body{padding:20px}
.card-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
.app{min-height:100vh}
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);z-index:70;
  background:linear-gradient(180deg,#0A2247 0%,#0B2751 55%,#0A2247 100%);
  color:#DCE6F5;display:flex;flex-direction:column;
  transition:width .22s cubic-bezier(.4,0,.2,1), transform .26s cubic-bezier(.4,0,.2,1);
  border-right:1px solid rgba(255,255,255,.06);
}
.sidebar-brand{
  display:flex;align-items:center;gap:11px;height:var(--topbar-h);padding:0 18px;
  border-bottom:1px solid rgba(255,255,255,.08);flex:none;overflow:hidden;
}
.brand-mark{
  width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,#2563EB,#174EA6);color:#fff;font-weight:800;font-size:17px;
  box-shadow:0 4px 12px rgba(37,99,235,.4);letter-spacing:-.02em;
}
.brand-text{display:flex;flex-direction:column;line-height:1.15;overflow:hidden;white-space:nowrap}
.brand-text strong{font-size:14.5px;font-weight:800;color:#fff;letter-spacing:.02em}
.brand-text span{font-size:10.5px;color:#8FA9CD;letter-spacing:.06em;text-transform:uppercase;font-weight:600}

.sidebar-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 12px 20px}
.sidebar-nav::-webkit-scrollbar{width:6px}
.sidebar-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px;border:none}
.nav-group-label{
  font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:#6C87AF;padding:14px 12px 6px;white-space:nowrap;
}
.nav-item{
  display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:9px;
  color:#B9C9E2;font-size:13.5px;font-weight:500;position:relative;
  transition:background .15s,color .15s;white-space:nowrap;margin-bottom:2px;
}
.nav-item svg{width:18px;height:18px;flex:none;opacity:.92}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(37,99,235,.95),rgba(23,78,166,.7));color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(37,99,235,.3)}
.nav-item.active svg{opacity:1}
.nav-item .count{
  margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;
  min-width:19px;height:19px;border-radius:999px;display:grid;place-items:center;padding:0 5px;
}
.nav-label{overflow:hidden;text-overflow:ellipsis}

.sidebar-foot{flex:none;border-top:1px solid rgba(255,255,255,.08);padding:12px}
.branch-chip{
  display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;
  background:rgba(255,255,255,.06);margin-bottom:8px;overflow:hidden;
}
.branch-chip .ic{width:32px;height:32px;border-radius:8px;background:rgba(37,99,235,.28);display:grid;place-items:center;flex:none;color:#9DC0F5}
.branch-chip .ic svg{width:16px;height:16px}
.branch-chip .tx{overflow:hidden;white-space:nowrap;min-width:0}
.branch-chip .tx b{display:block;font-size:12.5px;color:#fff;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.branch-chip .tx span{font-size:10.5px;color:#8FA9CD}
.user-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;transition:background .15s;overflow:hidden}
.user-chip:hover{background:rgba(255,255,255,.07)}
.avatar{
  width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:12.5px;font-weight:700;color:#fff;background:var(--brand-600);letter-spacing:.02em;
}
.avatar.lg{width:44px;height:44px;font-size:15px}
.avatar.sm{width:28px;height:28px;font-size:11px}
.user-chip .tx{overflow:hidden;white-space:nowrap;min-width:0;flex:1}
.user-chip .tx b{display:block;font-size:12.5px;color:#fff;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.user-chip .tx span{font-size:10.5px;color:#8FA9CD;display:block;overflow:hidden;text-overflow:ellipsis}
.logout-btn{color:#93A9C9;flex:none}
.logout-btn:hover{background:rgba(220,38,38,.18);color:#FCA5A5}

/* Collapsed sidebar */
body.nav-collapsed .sidebar{width:var(--sidebar-w-collapsed)}
body.nav-collapsed .brand-text,
body.nav-collapsed .nav-label,
body.nav-collapsed .nav-group-label,
body.nav-collapsed .nav-item .count,
body.nav-collapsed .branch-chip .tx,
body.nav-collapsed .user-chip .tx,
body.nav-collapsed .logout-btn{display:none}
body.nav-collapsed .sidebar-brand{justify-content:center;padding:0}
body.nav-collapsed .nav-item{justify-content:center;padding:0}
body.nav-collapsed .branch-chip{justify-content:center;padding:8px}
body.nav-collapsed .user-chip{justify-content:center}
body.nav-collapsed .main{margin-left:var(--sidebar-w-collapsed)}

.main{margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column;transition:margin-left .22s cubic-bezier(.4,0,.2,1)}

/* ---------- Topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:50;height:var(--topbar-h);flex:none;
  background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 22px;
}
.topbar-search{flex:1;max-width:440px}
.topbar-search .input{height:38px;background:var(--bg);border-color:transparent}
.topbar-search .input:focus{background:#fff;border-color:var(--brand-500)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.topbar-divider{width:1px;height:26px;background:var(--border);margin:0 4px}

.dropdown{position:relative}
.dropdown-panel{
  position:absolute;top:calc(100% + 9px);right:0;min-width:238px;background:#fff;
  border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);
  padding:7px;opacity:0;visibility:hidden;transform:translateY(-6px);
  transition:opacity .16s,transform .16s,visibility .16s;z-index:80;
}
.dropdown.open .dropdown-panel{opacity:1;visibility:visible;transform:translateY(0)}
.dropdown-item{
  display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border-radius:8px;
  font-size:13px;font-weight:500;color:var(--text-2);text-align:left;transition:background .13s,color .13s;
}
.dropdown-item:hover{background:var(--brand-50);color:var(--brand-700)}
.dropdown-item svg{width:16px;height:16px;flex:none}
.dropdown-item.danger:hover{background:var(--red-bg);color:var(--red)}
.dropdown-item.active{background:var(--brand-50);color:var(--brand-700);font-weight:600}
.dropdown-sep{height:1px;background:var(--border);margin:6px 4px}
.dropdown-head{padding:10px 11px 8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}

.branch-pill{
  display:flex;align-items:center;gap:9px;height:38px;padding:0 12px;border-radius:9px;
  border:1px solid var(--border-strong);background:#fff;font-size:13px;font-weight:600;color:var(--text);
  transition:border-color .15s,background .15s;max-width:230px;
}
.branch-pill:hover{border-color:var(--brand-200);background:var(--brand-50)}
.branch-pill .dot-live{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none;box-shadow:0 0 0 3px rgba(21,128,61,.15)}
.branch-pill svg{width:15px;height:15px;color:var(--text-3);flex:none}
.branch-pill .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.user-trigger{display:flex;align-items:center;gap:10px;padding:4px 8px 4px 4px;border-radius:10px;transition:background .15s}
.user-trigger:hover{background:var(--gray-bg)}
.user-trigger .tx{text-align:left;line-height:1.25;max-width:140px}
.user-trigger .tx b{display:block;font-size:12.8px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-trigger .tx span{font-size:10.8px;color:var(--text-3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-trigger svg.chev{width:15px;height:15px;color:var(--text-3);flex:none}

.notif-dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #fff}
.icon-btn.has-dot{position:relative}

/* ---------- Content ---------- */
.content{flex:1;padding:24px 26px 48px;max-width:1560px;width:100%;margin:0 auto}

.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:20px}
.page-head .titles h1{font-size:22px;font-weight:700;letter-spacing:-.025em}
.page-head .titles p{font-size:13px;color:var(--text-3);margin-top:3px}
.page-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}

/* Greeting banner */
.greet{
  background:linear-gradient(120deg,#0A2247 0%,#123C7E 52%,#174EA6 100%);
  border-radius:var(--radius-lg);padding:24px 26px;color:#fff;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap;margin-bottom:22px;
  box-shadow:0 12px 30px rgba(10,34,71,.22);
}
.greet::after{
  content:"";position:absolute;right:-70px;top:-90px;width:290px;height:290px;border-radius:50%;
  background:radial-gradient(circle,rgba(37,99,235,.5),transparent 66%);
}
.greet::before{
  content:"";position:absolute;right:120px;bottom:-110px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.09),transparent 70%);
}
.greet-text{position:relative;z-index:1}
.greet-text h1{font-size:22px;font-weight:700;letter-spacing:-.025em}
.greet-text p{font-size:13px;color:#A9C3E8;margin-top:4px}
.greet-meta{display:flex;gap:26px;position:relative;z-index:1;flex-wrap:wrap}
.greet-meta .m{display:flex;flex-direction:column;gap:2px}
.greet-meta .m span{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#8FA9CD;font-weight:600}
.greet-meta .m b{font-size:14px;font-weight:600;color:#fff}

/* ---------- KPI grid ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}
@media(max-width:1180px){.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.kpi-grid{grid-template-columns:1fr}}
.kpi{
  background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:17px 18px;
  box-shadow:var(--shadow-xs);position:relative;overflow:hidden;transition:box-shadow .18s,transform .18s,border-color .18s;
}
.kpi:hover{box-shadow:var(--shadow);transform:translateY(-1px);border-color:var(--border-strong)}
.kpi-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.kpi-label{font-size:12px;font-weight:600;color:var(--text-3);letter-spacing:.02em;text-transform:uppercase}
.kpi-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.kpi-ic svg{width:18px;height:18px}
.kpi-val{font-size:25px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.kpi-val .unit{font-size:15px;font-weight:600;color:var(--text-2);letter-spacing:0}
.kpi-foot{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11.8px;color:var(--text-3)}
.trend{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:11.5px}
.trend.up{color:var(--green)}
.trend.down{color:var(--red)}
.trend svg{width:13px;height:13px}
.kpi-accent{position:absolute;left:0;top:0;bottom:0;width:3px}

/* ---------- Grids ---------- */
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid-2-1{grid-template-columns:1.7fr 1fr}
.grid-1-2{grid-template-columns:1fr 1.7fr}
@media(max-width:1180px){.grid-3,.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-2-1,.grid-1-2{grid-template-columns:1fr}}
@media(max-width:760px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

/* ---------- Charts ---------- */
.bars{display:flex;align-items:flex-end;gap:12px;width:100%}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;min-width:0}
.bar-track{flex:1;width:100%;max-width:56px;display:flex;align-items:flex-end;background:var(--brand-50);border-radius:8px;overflow:hidden}
.bar-fill{width:100%;background:linear-gradient(180deg,#3B82F6,#174EA6);border-radius:8px;transition:height .5s cubic-bezier(.4,0,.2,1)}
.bar-fill.alt{background:linear-gradient(180deg,#7DD3A0,#15803D)}
.bar-fill.alt2{background:linear-gradient(180deg,#FBBF6B,#B45309)}
.bar-val{font-size:11.5px;font-weight:700;color:var(--text-2);margin-bottom:6px;white-space:nowrap}
.bar-label{font-size:11.5px;color:var(--text-3);margin-top:8px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-weight:500}

.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{
  width:168px;height:168px;border-radius:50%;flex:none;position:relative;
  display:grid;place-items:center;
}
.donut-hole{
  width:112px;height:112px;border-radius:50%;background:#fff;display:grid;place-items:center;
  text-align:center;line-height:1.2;box-shadow:inset 0 0 0 1px var(--border);
}
.donut-hole strong{display:block;font-size:20px;font-weight:700;letter-spacing:-.03em}
.donut-hole span{font-size:10.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.legend{display:flex;flex-direction:column;gap:11px;flex:1;min-width:170px}
.legend-row{display:flex;align-items:center;gap:10px;font-size:13px}
.legend-swatch{width:10px;height:10px;border-radius:3px;flex:none}
.legend-row .lbl{color:var(--text-2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend-row .val{font-weight:700;font-variant-numeric:tabular-nums}

.segmented{display:inline-flex;background:var(--gray-bg);border-radius:9px;padding:3px;gap:2px}
.segmented button{
  padding:6px 13px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--text-2);
  transition:background .15s,color .15s,box-shadow .15s;
}
.segmented button.active{background:#fff;color:var(--brand-700);box-shadow:var(--shadow-xs)}
.segmented button:hover:not(.active){color:var(--text)}

.chart-holder{width:100%;overflow:hidden}
.chart-holder svg{width:100%;height:auto;display:block}

/* ---------- Tables ---------- */
.table-wrap{width:100%;overflow-x:auto}
.table{width:100%;border-collapse:collapse;font-size:13.2px}
.table thead th{
  text-align:left;padding:11px 16px;font-size:11px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--text-3);background:var(--surface-2);
  border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;
}
.table tbody td{padding:13px 16px;border-bottom:1px solid var(--border);color:var(--text-2);vertical-align:middle}
.table tbody tr:last-child td{border-bottom:none}
.table tbody tr{transition:background .12s}
.table tbody tr:hover{background:var(--brand-50)}
.table tbody td.strong-cell{color:var(--text);font-weight:600}
.table .row-actions{display:flex;align-items:center;gap:2px;justify-content:flex-end}
.table .cell-main{color:var(--text);font-weight:600}
.table .cell-sub{font-size:11.5px;color:var(--text-3);display:block}
.table.compact tbody td{padding:9px 14px}
.table.compact thead th{padding:9px 14px}

@media(max-width:820px){
  .table.responsive thead{display:none}
  .table.responsive tbody tr{
    display:block;border:1px solid var(--border);border-radius:11px;margin-bottom:11px;
    padding:6px 14px;background:#fff;box-shadow:var(--shadow-xs);
  }
  .table.responsive tbody td{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:9px 0;border-bottom:1px dashed var(--border);
  }
  .table.responsive tbody td:last-child{border-bottom:none}
  .table.responsive tbody td::before{
    content:attr(data-label);font-size:10.5px;font-weight:700;letter-spacing:.07em;
    text-transform:uppercase;color:var(--text-3);flex:none;
  }
  .table.responsive tbody td .row-actions{justify-content:flex-end}
  .table.responsive tbody tr:hover{background:#fff}
}

/* ---------- Toolbar / filter bar ---------- */
.toolbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px;
  border-bottom:1px solid var(--border);background:var(--surface-2);
  border-radius:var(--radius) var(--radius) 0 0;
}
.toolbar .spacer{flex:1}
.toolbar .input,.toolbar .select{height:36px;font-size:13px}
.toolbar .input-group{min-width:230px;flex:1;max-width:330px}
.filter-chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:31px;padding:0 12px;border-radius:999px;
  border:1px solid var(--border-strong);background:#fff;font-size:12.5px;font-weight:600;color:var(--text-2);
  transition:all .15s;white-space:nowrap;
}
.chip:hover{border-color:var(--brand-200);color:var(--brand-700);background:var(--brand-50)}
.chip.active{background:var(--brand-600);border-color:var(--brand-600);color:#fff}
.chip .n{background:rgba(255,255,255,.25);border-radius:999px;padding:0 6px;font-size:11px}
.chip:not(.active) .n{background:var(--gray-bg)}

/* ---------- Pagination ---------- */
.pagination{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;flex-wrap:wrap}
.pagination .info{font-size:12.5px;color:var(--text-3)}
.pagination .pages{display:flex;gap:5px;align-items:center}
.page-btn{
  min-width:33px;height:33px;padding:0 8px;border-radius:8px;border:1px solid var(--border-strong);
  background:#fff;font-size:12.8px;font-weight:600;color:var(--text-2);
  display:inline-flex;align-items:center;justify-content:center;transition:all .15s;
}
.page-btn:hover:not(:disabled){border-color:var(--brand-200);color:var(--brand-700);background:var(--brand-50)}
.page-btn.active{background:var(--brand-600);border-color:var(--brand-600);color:#fff}
.page-btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- Empty / loading states ---------- */
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:54px 24px;text-align:center;color:var(--text-3);
}
.empty .ic{
  width:54px;height:54px;border-radius:14px;background:var(--brand-50);display:grid;place-items:center;color:var(--brand-500);
}
.empty .ic svg{width:26px;height:26px}
.empty h4{font-size:14.5px;font-weight:700;color:var(--text)}
.empty p{font-size:13px;max-width:340px}

.skeleton{
  background:linear-gradient(90deg,#EDF1F7 25%,#F6F8FC 37%,#EDF1F7 63%);
  background-size:400% 100%;animation:shimmer 1.3s ease-in-out infinite;border-radius:8px;
}
@keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}
.sk-line{height:13px;margin-bottom:11px}
.spinner{
  width:17px;height:17px;border:2.4px solid rgba(255,255,255,.35);border-top-color:#fff;
  border-radius:50%;animation:spin .7s linear infinite;
}
.spinner.dark{border-color:rgba(23,78,166,.25);border-top-color:var(--brand-600)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Modal ---------- */
.modal-scrim{
  position:fixed;inset:0;background:rgba(10,25,50,.5);backdrop-filter:blur(3px);z-index:200;
  display:flex;align-items:flex-start;justify-content:center;padding:40px 18px;overflow-y:auto;
  animation:fadeIn .16s ease-out;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:#fff;border-radius:15px;box-shadow:var(--shadow-lg);width:100%;max-width:620px;
  animation:slideUp .22s cubic-bezier(.4,0,.2,1);margin:auto 0;overflow:hidden;
}
.modal.sm{max-width:440px}
.modal.lg{max-width:840px}
.modal.xl{max-width:1060px}
@keyframes slideUp{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
.modal-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:19px 22px;
  border-bottom:1px solid var(--border);
}
.modal-head h3{font-size:16.5px;font-weight:700;letter-spacing:-.015em}
.modal-head p{font-size:12.5px;color:var(--text-3);margin-top:2px}
.modal-body{padding:22px;max-height:calc(100vh - 240px);overflow-y:auto}
.modal-foot{
  display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:15px 22px;
  border-top:1px solid var(--border);background:var(--surface-2);flex-wrap:wrap;
}
.modal-foot .left{margin-right:auto;display:flex;gap:9px;flex-wrap:wrap}

/* ---------- Toasts ---------- */
.toast-stack{position:fixed;top:18px;right:18px;z-index:400;display:flex;flex-direction:column;gap:10px;max-width:370px;width:calc(100vw - 36px)}
.toast{
  display:flex;align-items:flex-start;gap:11px;background:#fff;border:1px solid var(--border);
  border-left:4px solid var(--brand-600);border-radius:11px;padding:13px 15px;box-shadow:var(--shadow-lg);
  animation:toastIn .24s cubic-bezier(.4,0,.2,1);
}
@keyframes toastIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .2s forwards}
@keyframes toastOut{to{opacity:0;transform:translateX(24px)}}
.toast.success{border-left-color:var(--green)}
.toast.warning{border-left-color:var(--orange)}
.toast.error{border-left-color:var(--red)}
.toast.info{border-left-color:var(--brand-600)}
.toast .ic{flex:none;width:19px;height:19px;margin-top:1px}
.toast.success .ic{color:var(--green)}
.toast.warning .ic{color:var(--orange)}
.toast.error .ic{color:var(--red)}
.toast.info .ic{color:var(--brand-600)}
.toast .tx{flex:1;min-width:0}
.toast .tx b{display:block;font-size:13.2px;font-weight:600}
.toast .tx span{font-size:12.3px;color:var(--text-3)}

/* ---------- Notification / alert items ---------- */
.alert-item{
  display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border-radius:11px;
  border:1px solid var(--border);background:#fff;transition:border-color .15s,background .15s;
}
.alert-item:hover{border-color:var(--border-strong);background:var(--surface-2)}
.alert-item .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.alert-item .ic svg{width:17px;height:17px}
.alert-item .tx{flex:1;min-width:0}
.alert-item .tx b{display:block;font-size:13px;font-weight:600;color:var(--text)}
.alert-item .tx p{font-size:12.3px;color:var(--text-3);margin-top:2px}
.alert-item .tm{font-size:11.5px;color:var(--text-3);white-space:nowrap;flex:none}
.ic-red{background:var(--red-bg);color:var(--red)}
.ic-orange{background:var(--orange-bg);color:var(--orange)}
.ic-green{background:var(--green-bg);color:var(--green)}
.ic-blue{background:var(--blue-bg);color:var(--blue)}
.ic-gray{background:var(--gray-bg);color:var(--gray)}

/* ---------- Quick actions ---------- */
.qa-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
@media(max-width:900px){.qa-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:620px){.qa-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qa{
  display:flex;flex-direction:column;align-items:flex-start;gap:9px;padding:15px 14px;
  border:1px solid var(--border);border-radius:11px;background:#fff;text-align:left;
  transition:all .16s;font-size:12.8px;font-weight:600;color:var(--text);
}
.qa:hover{border-color:var(--brand-200);background:var(--brand-50);transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.qa .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--brand-100);color:var(--brand-700)}
.qa .ic svg{width:17px;height:17px}

/* ---------- Misc ---------- */
.divider{height:1px;background:var(--border);margin:18px 0}
.stat-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--border)}
.stat-row:last-child{border-bottom:none}
.stat-row .lbl{font-size:13px;color:var(--text-2)}
.stat-row .val{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.stat-row.total{border-top:2px solid var(--border-strong);margin-top:6px;padding-top:13px}
.stat-row.total .lbl{font-weight:700;color:var(--text)}
.stat-row.total .val{font-size:15.5px}

.progress{height:7px;background:var(--gray-bg);border-radius:999px;overflow:hidden}
.progress > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#2563EB,#174EA6);transition:width .4s}
.progress.green > i{background:linear-gradient(90deg,#22C55E,#15803D)}
.progress.orange > i{background:linear-gradient(90deg,#F59E0B,#B45309)}
.progress.red > i{background:linear-gradient(90deg,#EF4444,#B91C1C)}

.tabs{display:flex;gap:3px;border-bottom:1px solid var(--border);overflow-x:auto;padding:0 4px}
.tab{
  padding:11px 15px;font-size:13.2px;font-weight:600;color:var(--text-3);position:relative;
  white-space:nowrap;transition:color .15s;
}
.tab:hover{color:var(--text)}
.tab.active{color:var(--brand-700)}
.tab.active::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2.5px;background:var(--brand-600);border-radius:3px 3px 0 0}

.kv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px}
@media(max-width:640px){.kv-grid{grid-template-columns:1fr}}
.kv{display:flex;flex-direction:column;gap:3px;padding:11px 0;border-bottom:1px solid var(--border)}
.kv .k{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3)}
.kv .v{font-size:13.5px;font-weight:600;color:var(--text)}

/* ============================================================
   AUTH SCREENS
   ============================================================ */
.auth{min-height:100vh;display:grid;grid-template-columns:1.06fr .94fr}
@media(max-width:940px){.auth{grid-template-columns:1fr}.auth-aside{display:none!important}}
.auth-aside{
  background:linear-gradient(155deg,#061530 0%,#0A2247 38%,#123C7E 76%,#174EA6 100%);
  color:#fff;padding:52px 54px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;
}
.auth-aside::after{
  content:"";position:absolute;right:-160px;top:-140px;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle,rgba(37,99,235,.42),transparent 68%);
}
.auth-aside::before{
  content:"";position:absolute;left:-140px;bottom:-190px;width:460px;height:460px;border-radius:50%;
  background:radial-gradient(circle,rgba(23,78,166,.5),transparent 70%);
}
.auth-aside > *{position:relative;z-index:1}
.auth-logo{display:flex;align-items:center;gap:13px}
.auth-logo .brand-mark{width:46px;height:46px;font-size:20px;border-radius:12px}
.auth-logo .tx b{display:block;font-size:15px;font-weight:800;letter-spacing:.03em}
.auth-logo .tx span{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#8FA9CD;font-weight:600}
.auth-hero h1{font-size:36px;font-weight:800;letter-spacing:-.035em;line-height:1.14;margin-bottom:16px;max-width:460px}
.auth-hero p{font-size:15px;color:#A9C3E8;max-width:460px;line-height:1.65}
.auth-features{display:flex;flex-direction:column;gap:15px;margin-top:34px}
.auth-feature{display:flex;align-items:flex-start;gap:13px}
.auth-feature .ic{
  width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.13);
  display:grid;place-items:center;flex:none;color:#9DC0F5;
}
.auth-feature .ic svg{width:18px;height:18px}
.auth-feature .tx b{display:block;font-size:13.5px;font-weight:600}
.auth-feature .tx span{font-size:12.5px;color:#8FA9CD}
.auth-foot{font-size:12px;color:#7A93B8;display:flex;gap:16px;flex-wrap:wrap;align-items:center}

.auth-main{display:flex;align-items:center;justify-content:center;padding:40px 26px;background:var(--bg)}
.auth-card{width:100%;max-width:412px}
.auth-card .head{margin-bottom:28px}
.auth-card .head .mobile-logo{display:none}
@media(max-width:940px){
  .auth-card .head .mobile-logo{display:flex;align-items:center;gap:11px;margin-bottom:24px}
}
.auth-card .head h2{font-size:25px;font-weight:700;letter-spacing:-.03em}
.auth-card .head p{font-size:13.5px;color:var(--text-3);margin-top:5px}
.auth-form .input{height:44px}
.auth-form .field label{font-size:12.8px}
.auth-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.link{color:var(--brand-600);font-size:13px;font-weight:600;transition:color .15s}
.link:hover{color:var(--brand-700);text-decoration:underline}
.demo-note{
  margin-top:22px;padding:12px 14px;border-radius:10px;background:var(--brand-50);
  border:1px solid var(--brand-100);font-size:12.3px;color:var(--brand-700);line-height:1.6;
}
.demo-note b{font-weight:700}
.auth-meta{margin-top:30px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:11.5px;color:var(--text-3);flex-wrap:wrap}

/* Setup wizard */
.setup-wrap{min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
.setup-top{
  height:70px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;
  padding:0 26px;gap:14px;position:sticky;top:0;z-index:40;
}
.setup-body{flex:1;padding:34px 26px 60px;max-width:940px;width:100%;margin:0 auto}
.steps{display:flex;align-items:center;gap:0;margin-bottom:32px;overflow-x:auto;padding-bottom:6px}
.step{display:flex;align-items:center;flex:none}
.step .bubble{
  width:33px;height:33px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;
  background:#fff;border:1.6px solid var(--border-strong);color:var(--text-3);flex:none;transition:all .2s;
}
.step.done .bubble{background:var(--green);border-color:var(--green);color:#fff}
.step.active .bubble{background:var(--brand-600);border-color:var(--brand-600);color:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.15)}
.step .nm{font-size:12.5px;font-weight:600;color:var(--text-3);margin:0 14px 0 9px;white-space:nowrap}
.step.active .nm{color:var(--brand-700)}
.step.done .nm{color:var(--text-2)}
.step .line{width:26px;height:1.6px;background:var(--border-strong);flex:none}
.step.done .line{background:var(--green)}

/* Receipt */
.receipt{
  background:#fff;border:1px solid var(--border);border-radius:10px;padding:26px 24px;
  font-family:'Inter',monospace;max-width:400px;margin:0 auto;box-shadow:var(--shadow-sm);
}
.receipt .r-head{text-align:center;border-bottom:1.5px dashed var(--border-strong);padding-bottom:16px;margin-bottom:16px}
.receipt .r-head h3{font-size:15px;font-weight:800;letter-spacing:.04em}
.receipt .r-head p{font-size:11.5px;color:var(--text-3);margin-top:3px}
.receipt .r-line{display:flex;justify-content:space-between;gap:14px;font-size:12.6px;padding:5px 0;color:var(--text-2)}
.receipt .r-line b{color:var(--text);font-weight:600;text-align:right}
.receipt .r-total{
  display:flex;justify-content:space-between;font-size:16px;font-weight:800;color:var(--text);
  border-top:1.5px dashed var(--border-strong);margin-top:14px;padding-top:14px;
}
.receipt .r-foot{text-align:center;border-top:1.5px dashed var(--border-strong);margin-top:18px;padding-top:16px;font-size:11.5px;color:var(--text-3);line-height:1.7}
.receipt .r-foot b{color:var(--brand-700)}

/* Mobile nav */
.scrim{
  position:fixed;inset:0;background:rgba(10,25,50,.45);z-index:65;opacity:0;visibility:hidden;
  transition:opacity .22s,visibility .22s;
}
@media(max-width:1024px){
  .sidebar{transform:translateX(-100%);width:var(--sidebar-w)!important}
  body.nav-open .sidebar{transform:translateX(0)}
  body.nav-open .scrim{opacity:1;visibility:visible}
  .main{margin-left:0!important}
  body.nav-collapsed .brand-text,
  body.nav-collapsed .nav-label,
  body.nav-collapsed .nav-group-label,
  body.nav-collapsed .branch-chip .tx,
  body.nav-collapsed .user-chip .tx,
  body.nav-collapsed .logout-btn{display:revert}
  body.nav-collapsed .sidebar-brand{justify-content:flex-start;padding:0 18px}
  body.nav-collapsed .nav-item{justify-content:flex-start;padding:0 12px}
  body.nav-collapsed .branch-chip{justify-content:flex-start;padding:10px}
  body.nav-collapsed .user-chip{justify-content:flex-start}
}

const delay = (ms = 190) => new Promise(res => setTimeout(res, ms));
const uid = (prefix) => prefix + '-' + Math.random().toString(36).slice(2, 7).toUpperCase();

function makeMockResource(name, storeFn, idPrefix){
  return {
    async list(params){
      await delay();
      let rows = storeFn().slice();
      if(params && params.branch && params.branch !== 'ALL'){
        rows = rows.filter(r => r.branch === params.branch);
      }
      if(params && params.search){
        const q = String(params.search).toLowerCase();
        rows = rows.filter(r => JSON.stringify(r).toLowerCase().includes(q));
      }
      return rows;
    },
    async retrieve(id){
      await delay(120);
      return storeFn().find(r => r.id === id) || null;
    },
    async create(payload){
      await delay(320);
      const record = Object.assign({ id: uid(idPrefix) }, payload);
      storeFn().unshift(record);
      pushAudit('Created ' + name.replace(/s$/, ''), payload);
      return record;
    },
    async update(id, payload){
      await delay(260);
      const arr = storeFn();
      const idx = arr.findIndex(r => r.id === id);
      if(idx > -1){ Object.assign(arr[idx], payload); return arr[idx]; }
      return null;
    },
    async remove(id){
      await delay(220);
      const arr = storeFn();
      const idx = arr.findIndex(r => r.id === id);
      if(idx > -1) arr.splice(idx, 1);
      return { success:true };
    }
  };
}

function pushAudit(action, payload){

    record: payload && payload.id ? payload.id : uid('REC'),
    ip: '192.168.1.41',
    detail: payload && payload.description ? payload.description : ''
  });
}

/* --- Real driver (Django REST Framework) -------------------------- */
function makeRestResource(path){
  const headers = () => ({
    'Content-Type':'application/json',
    'Authorization': Session.token ? ('Bearer ' + Session.token) : ''
  });
  return {
    async list(params){
      const qs = params ? ('?' + new URLSearchParams(params).toString()) : '';
      const r = await fetch(API_BASE + path + qs, { headers: headers() });
      if(!r.ok) throw new Error('Request failed: ' + r.status);
      return r.json();
    },
    async retrieve(id){
      const r = await fetch(API_BASE + path + id + '/', { headers: headers() });
      if(!r.ok) throw new Error('Request failed: ' + r.status);
      return r.json();
    },
    async create(payload){
      const r = await fetch(API_BASE + path, { method:'POST', headers: headers(), body: JSON.stringify(payload) });
      if(!r.ok) throw new Error('Request failed: ' + r.status);
      return r.json();
    },
    async update(id, payload){
      const r = await fetch(API_BASE + path + id + '/', { method:'PATCH', headers: headers(), body: JSON.stringify(payload) });
      if(!r.ok) throw new Error('Request failed: ' + r.status);
      return r.json();
    },
    async remove(id){
      const r = await fetch(API_BASE + path + id + '/', { method:'DELETE', headers: headers() });
      if(!r.ok) throw new Error('Request failed: ' + r.status);
      return { success:true };
    }
  };
}

const $  = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

const fmt = {
  money(v, withCode){
    const n = Number(v || 0);
    const s = n.toLocaleString('en-KE', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    return (withCode === false ? '' : APP.currency + ' ') + s;
  },
  moneySigned(v){
    const n = Number(v || 0);
    return (n < 0 ? '-' : '') + APP.currency + ' ' + Math.abs(n).toLocaleString('en-KE');
  },
  num(v){ return Number(v || 0).toLocaleString('en-KE'); },
  pct(v, total){ return total ? Math.round((v / total) * 100) : 0; },
  date(iso){
    if(!iso || iso === '—') return '—';
    const d = new Date(iso + 'T00:00:00');
    if(isNaN(d)) return iso;
    return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
  },
  shortDate(iso){
    if(!iso || iso === '—') return '—';
    const d = new Date(iso + 'T00:00:00');
    if(isNaN(d)) return iso;
    return d.toLocaleDateString('en-GB', { day:'2-digit', month:'2-digit', year:'numeric' });
  },
  initials(name){
    if(!name) return '?';
    return name.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  },
  escape(str){
    if(str === null || str === undefined) return '';
    return String(str).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
};

/* --- Badges -------------------------------------------------------- */
function badge(text, variant, withDot){
  return '<span class="badge badge-' + (variant || 'gray') + '">' +
    (withDot ? '<span class="dot"></span>' : '') + fmt.escape(text) + '</span>';
}
function statusBadge(status){
  const map = {
    'Paid':'green','Completed':'green','Active':'green','Present':'green','Approved':'green','Online':'green','In Stock':'green','Submitted':'green',
    'Pending':'orange','Pending Approval':'orange','Late':'orange','Maintenance Due':'orange','Low Stock':'orange','Partially Paid':'orange','On Leave':'orange','Warning':'orange',
    'Cancelled':'red','Offline':'red','Absent':'red','Out of Stock':'red','Rejected':'red','Critical':'red','Unpaid':'red',
    'Refunded':'gray','Inactive':'gray','Draft':'gray','Dismissed':'gray'
  };
  const v = map[status] || 'blue';
  return badge(status, v, ['Online','Offline','Present','Absent','Active','Inactive'].includes(status));
}

    html += '<div class="card-head"><div><div class="title">' + o.title + '</div>' +
      (o.subtitle ? '<div class="sub">' + o.subtitle + '</div>' : '') + '</div>' +
      (o.actions ? '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' + o.actions + '</div>' : '') +
      '</div>';
  }
  html += o.body !== undefined ? '<div class="' + (o.noPad ? '' : 'card-body') + '">' + o.body + '</div>' : '';
  if(o.footer) html += '<div class="card-foot">' + o.footer + '</div>';
  html += '</section>';
  return html;
}

/* --- KPI card ------------------------------------------------------ */
function kpiCard(o){
  const accents = { blue:'#2563EB', green:'#15803D', orange:'#B45309', red:'#B91C1C', purple:'#6D28D9', cyan:'#0E7490', slate:'#475569' };
  const tint = accents[o.tone || 'blue'];
  const iconBg = {
    blue:'var(--brand-100);color:var(--brand-700)',
    green:'var(--green-bg);color:var(--green)',
    orange:'var(--orange-bg);color:var(--orange)',
    red:'var(--red-bg);color:var(--red)',
    purple:'#F1EBFD;color:#6D28D9',
    cyan:'#E0F2F7;color:#0E7490',
    slate:'var(--gray-bg);color:var(--gray)'
  }[o.tone || 'blue'];

  let foot = '';
  if(o.trend !== undefined){
    const up = o.trend >= 0;
    foot = '<div class="kpi-foot"><span class="trend ' + (up ? 'up' : 'down') + '">' +
      icon(up ? 'trending-up' : 'arrow-down') + Math.abs(o.trend) + '%</span>' +
      '<span>' + (o.trendLabel || 'vs yesterday') + '</span></div>';
  } else if(o.foot){
    foot = '<div class="kpi-foot">' + o.foot + '</div>';
  }

  return '<article class="kpi">' +
    '<span class="kpi-accent" style="background:' + tint + '"></span>' +
    '<div class="kpi-top"><span class="kpi-label">' + o.label + '</span>' +
    '<span class="kpi-ic" style="' + iconBg + '">' + icon(o.icon || 'activity') + '</span></div>' +
    '<div class="kpi-val">' + (o.prefix ? '<span class="unit">' + o.prefix + '</span> ' : '') + o.value + '</div>' +
    foot + '</article>';
}

/* --- Data table ---------------------------------------------------- */
function dataTable(opts){
  const cols = opts.columns || [];
  const rows = opts.rows || [];
  if(!rows.length){
    return emptyState(opts.emptyTitle || 'No records found', opts.emptyText || 'There is nothing to display here yet.', opts.emptyIcon || 'archive');
  }
  const responsive = opts.responsive !== false;
  let html = '<div class="table-wrap"><table class="table' + (responsive ? ' responsive' : '') + (opts.compact ? ' compact' : '') + '"><thead><tr>';
  cols.forEach(c => {
    html += '<th' + (c.align ? ' style="text-align:' + c.align + '"' : '') + '>' + c.label + '</th>';
  });
  html += '</tr></thead><tbody>';
  rows.forEach(row => {
    html += '<tr' + (opts.rowAttrs ? ' ' + opts.rowAttrs(row) : '') + '>';
    cols.forEach(c => {
      const content = c.render ? c.render(row) : fmt.escape(row[c.key] === undefined ? '—' : row[c.key]);
      html += '<td data-label="' + c.label + '"' + (c.align ? ' class="ta-' + c.align + '"' : '') + '>' + content + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

/* --- Pagination ---------------------------------------------------- */
function pagination(total, page, perPage){
  const pages = Math.max(1, Math.ceil(total / perPage));
  const from = total === 0 ? 0 : (page - 1) * perPage + 1;
  const to = Math.min(page * perPage, total);
  let btns = '';
  btns += '<button class="page-btn" data-action="noop" disabled>' + icon('chevron-left') + '</button>';
  const list = [];
  for(let i = 1; i <= pages; i++){
    if(i === 1 || i === pages || Math.abs(i - page) <= 1) list.push(i);
    else if(list[list.length - 1] !== '…') list.push('…');
  }
  list.forEach(p => {
    if(p === '…') btns += '<span style="padding:0 4px;color:var(--text-3)">…</span>';
    else btns += '<button class="page-btn' + (p === page ? ' active' : '') + '" data-action="noop">' + p + '</button>';
  });
  btns += '<button class="page-btn" data-action="noop" disabled>' + icon('chevron-right') + '</button>';
  return '<div class="pagination"><div class="info">Showing <strong>' + from + '–' + to + '</strong> of <strong>' + fmt.num(total) + '</strong> records</div>' +
    '<div class="pages">' + btns + '</div></div>';
}

/* --- Charts -------------------------------------------------------- */
function barChart(data, opts){
  const o = opts || {};
  const max = Math.max.apply(null, data.map(d => d.value).concat([1]));
  const height = o.height || 210;
  const colorClass = o.variant ? ' ' + o.variant : '';
  return '<div class="bars" style="height:' + height + 'px">' +
    data.map(d => (
      '<div class="bar-col">' +
        '<div class="bar-val">' + (o.format ? o.format(d.value) : fmt.num(d.value)) + '</div>' +
        '<div class="bar-track"><div class="bar-fill' + colorClass + '" style="height:' + ((d.value / max) * 100).toFixed(1) + '%"></div></div>' +
        '<div class="bar-label">' + d.label + '</div>' +
      '</div>'
    )).join('') + '</div>';
}

function donutChart(data, opts){
  const o = opts || {};
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  let acc = 0;
  const stops = data.map(d => {
    const start = (acc / total) * 360;
    acc += d.value;
    const end = (acc / total) * 360;
    return d.color + ' ' + start.toFixed(2) + 'deg ' + end.toFixed(2) + 'deg';
  }).join(', ');

  const legend = data.map(d => (
    '<div class="legend-row">' +
      '<span class="legend-swatch" style="background:' + d.color + '"></span>' +
      '<span class="lbl">' + d.label + '</span>' +
      '<span class="val">' + (o.legendFormat ? o.legendFormat(d) : fmt.num(d.value)) + '</span>' +
    '</div>'
  )).join('');

  return '<div class="donut-wrap">' +
    '<div class="donut" style="background:conic-gradient(' + stops + ')">' +
      '<div class="donut-hole"><div><strong>' + fmt.num(total) + '</strong><span>' + (o.centerLabel || 'Total') + '</span></div></div>' +
    '</div>' +
    '<div class="legend">' + legend + '</div>' +
  '</div>';
}

function areaChart(values, labels, opts){
  const o = opts || {};
  const W = 660, H = 230, PL = 54, PR = 16, PT = 18, PB = 34;
  const max = Math.max.apply(null, values.concat([1])) * 1.18;
  const iw = W - PL - PR, ih = H - PT - PB;
  const stepX = values.length > 1 ? iw / (values.length - 1) : iw;
  const pts = values.map((v, i) => [PL + i * stepX, PT + ih - (v / max) * ih]);

  let grid = '';
  for(let i = 0; i <= 4; i++){
    const y = PT + (ih / 4) * i;
    const val = max - (max / 4) * i;
    grid += '<line x1="' + PL + '" y1="' + y.toFixed(1) + '" x2="' + (W - PR) + '" y2="' + y.toFixed(1) + '" stroke="#E8EDF5" stroke-width="1"/>';
    grid += '<text x="' + (PL - 10) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" font-size="10.5" fill="#7A889E" font-family="Inter,sans-serif">' +
      (o.yFormat ? o.yFormat(val) : Math.round(val)) + '</text>';
  }

  const linePath = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const areaPath = linePath + ' L ' + pts[pts.length - 1][0].toFixed(1) + ' ' + (PT + ih) + ' L ' + pts[0][0].toFixed(1) + ' ' + (PT + ih) + ' Z';

  let xLabels = '';
  const skip = Math.ceil(labels.length / 12);
  labels.forEach((l, i) => {
    if(i % skip !== 0 && i !== labels.length - 1) return;
    xLabels += '<text x="' + pts[i][0].toFixed(1) + '" y="' + (H - 12) + '" text-anchor="middle" font-size="10.5" fill="#7A889E" font-family="Inter,sans-serif">' + l + '</text>';
  });

  const dots = pts.map(p => '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="#fff" stroke="' + (o.color || '#2563EB') + '" stroke-width="2"/>').join('');

  return '<div class="chart-holder"><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Revenue trend chart">' +
    '<defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="' + (o.color || '#2563EB') + '" stop-opacity="0.26"/>' +
      '<stop offset="100%" stop-color="' + (o.color || '#2563EB') + '" stop-opacity="0.02"/>' +
    '</linearGradient></defs>' +
    grid +
    '<path d="' + areaPath + '" fill="url(#areaGrad)"/>' +
    '<path d="' + linePath + '" fill="none" stroke="' + (o.color || '#2563EB') + '" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>' +
    dots + xLabels +
  '</svg></div>';
}

    size:'sm',
    title: o.title || 'Are you sure?',

/* --- Toasts -------------------------------------------------------- */
function toast(message, type, title){
  const t = type || 'success';
  const icons = { success:'check-circle', warning:'alert-triangle', error:'alert-circle', info:'info' };
  const titles = { success:'Success', warning:'Warning', error:'Error', info:'Information' };
  const node = document.createElement('div');
  node.className = 'toast ' + t;
  node.innerHTML = '<span class="ic">' + icon(icons[t]) + '</span>' +
    '<div class="tx"><b>' + (title || titles[t]) + '</b><span>' + fmt.escape(message) + '</span></div>';
  $('#toast-root').appendChild(node);
  setTimeout(() => {
    node.classList.add('out');
    setTimeout(() => node.remove(), 220);
  }, 4200);
}

function sidebarHTML(){
  const allowed = navForRole(currentRole());
  const items = NAV.filter(n => allowed.includes(n.key));
  const unread = DB.notifications.filter(n => !n.read).length;

  let groups = [];
  items.forEach(item => {
    let g = groups.find(x => x.name === item.group);
    if(!g){ g = { name:item.group, items:[] }; groups.push(g); }
    g.items.push(item);
  });

  const navHTML = groups.map(g =>
    '<div class="nav-group-label">' + g.name + '</div>' +
    g.items.map(item =>
      '<a class="nav-item" href="#/' + item.key + '" data-nav="' + item.key + '" title="' + item.label + '">' +
        icon(item.icon) +
        '<span class="nav-label">' + item.label + '</span>' +
        (item.key === 'notifications' && unread ? '<span class="count">' + unread + '</span>' : '') +
      '</a>'
    ).join('')
  ).join('');

  const br = currentBranch();
  return '<aside class="sidebar">' +
    '<div class="sidebar-brand">' +
      '<div class="brand-mark">R</div>' +
      '<div class="brand-text"><strong>ROBOTECH</strong><span>Digital Solutions</span></div>' +
    '</div>' +

function qaButton(label, iconName, action){
  return '<button class="qa" data-action="' + action + '">' +

function alertItemHTML(n){
  const toneMap = { critical:'red', warning:'orange', info:'blue' };
  const iconMap = { 'Low Stock':'package', 'Printer Offline':'printer', 'Printer Maintenance':'tool', 'Cash Difference':'alert-triangle', 'Pending Approval':'clock', 'New User':'user-check', 'System Alert':'info' };
  const tone = toneMap[n.severity] || 'blue';
  return '<div class="alert-item">' +
    '<span class="ic ic-' + tone + '">' + icon(iconMap[n.type] || 'info') + '</span>' +
    '<div class="tx"><b>' + n.title + '</b><p>' + n.message + '</p></div>' +
    '<span class="tm">' + n.time + '</span>' +
  '</div>';
}

async function renderPrinterDetail(id){
  const p = await api.printers.retrieve(id);
  if(!p) return pageHead('Printer not found', 'The requested printer does not exist.') + emptyState('Printer not found', 'Return to the printer list.', 'printer');

  const tabs = ['Overview','Usage','Print Jobs','Counters','Maintenance','Ink / Consumables','Reports'];
  const jobs = DB.printJobs.filter(j => j.printer === p.name);

  return '<div style="margin-bottom:16px"><a class="btn btn-ghost btn-sm" href="#/printers">' + icon('chevron-left') + ' Back to printers</a></div>' +
  pageHead(p.name, p.brand + ' · ' + p.model + ' · ' + p.serial, statusBadge(p.status)) +

  card({
    noPad:true,
    body:'<div class="tabs" id="printer-tabs">' +
      tabs.map((t, i) => '<button class="tab' + (i === 0 ? ' active' : '') + '" data-tab="' + i + '">' + t + '</button>').join('') +
    '</div>' +
    '<div class="card-body" id="printer-tab-body">' + printerTabContent(0, p, jobs) + '</div>'
  });
}

          '<div class="alert-item" style="margin-top:18px;border-color:var(--' + diffTone + '-br);background:var(--' + diffTone + '-bg)">' +
            '<span class="ic ic-' + diffTone + '">' + icon(diffTone === 'green' ? 'check-circle' : 'alert-triangle') + '</span>' +
            '<div class="tx"><b>' + (diffTone === 'green' ? 'Cash balanced perfectly' : 'Cash discrepancy detected') + '</b>' +
            '<p>' + (diffTone === 'green' ? 'Expected and actual cash match exactly.' : 'A variance of ' + fmt.money(Math.abs(e.difference)) + ' was recorded. A supervisor note is required before submission.') + '</p></div>' +
          '</div>' +
          '<div class="field" style="margin-top:16px"><label>Supervisor Note</label>' +
          '<textarea class="textarea" placeholder="Explain any cash variance or operational issue…">Cash shortfall of KSh 100 attributed to change rounding during the 3:00 PM rush. Confirmed by cashier Faith Njeri.</textarea></div>'
      }) +
    '</div>';
  }
};

function statRow(label, value, tone, total){
  const color = tone === 'red' ? 'var(--red)' : tone === 'orange' ? 'var(--orange)' : '';
  return '<div class="stat-row' + (total ? ' total' : '') + '">' +
    '<span class="lbl">' + label + '</span>' +
    '<span class="val"' + (color ? ' style="color:' + color + '"' : '') + '>' + value + '</span>' +
  '</div>';
}

/* ================================================================
   12. GLOBAL ACTION HANDLER
   ================================================================ */
document.addEventListener('click', (e) => {
  /* Close dropdowns when clicking outside */
  const insideDropdown = e.target.closest('.dropdown');
  if(!insideDropdown) $$('.dropdown.open').forEach(d => d.classList.remove('open'));

  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  switch(action){
    /* --- Layout --- */
    case 'toggle-sidebar':
      Session.sidebarCollapsed = !Session.sidebarCollapsed;
      document.body.classList.toggle('nav-collapsed', Session.sidebarCollapsed);
      break;
    case 'open-mobile-nav':
      Session.mobileNavOpen = true;
      document.body.classList.add('nav-open');
      break;
    case 'close-mobile-nav':
      Session.mobileNavOpen = false;
      document.body.classList.remove('nav-open');
      break;
    case 'toggle-dropdown':
      e.preventDefault();
      const dd = el.closest('.dropdown');
      const wasOpen = dd.classList.contains('open');
      $$('.dropdown.open').forEach(d => d.classList.remove('open'));
      if(!wasOpen) dd.classList.add('open');
      break;
    case 'switch-branch':
      Session.branch = id;
      toast('Switched to ' + (DB.branches.find(b => b.id === id) || {}).name + '.', 'info', 'Branch changed');
      renderAppShell();
      navigate();
      break;
    case 'switch-role': {
      const role = id;
      Session.user.role = role;
      const allowed = navForRole(role);
      toast('Previewing the interface as ' + role + '.', 'info', 'Role changed');
      renderAppShell();
      const route = parseHash();
      if(!allowed.includes(route[0])) location.hash = '#/dashboard';
      else navigate();
      break;
    }
    case 'goto':
      location.hash = '#/' + id;
      break;
    case 'logout':
      confirmDialog({
        title:'Sign out?',
        message:'You will be returned to the login screen. Any unsaved work will be lost.',
        confirmText:'Sign out',
        danger:true,
        onConfirm: () => {
          Session.user = null;
          Session.token = null;
          document.body.classList.remove('nav-open', 'nav-collapsed');
          location.hash = '#/login';
          renderLogin();
        }
      });
      break;

    /* --- Modals --- */
    case 'close-modal': closeModal(); break;
    case 'scrim-close':
      if(e.target.classList.contains('modal-scrim')) closeModal();
      break;

    /* --- Sales --- */
    case 'new-transaction': case 'new-sale':
      openNewTransactionModal(); break;
    case 'view-transaction': {
      const t = DB.transactions.find(x => x.id === id);
      if(t) openReceiptModal(t);
      break;
    }
    case 'print-receipt': {
      const t = DB.transactions.find(x => x.id === id);
      if(t) openReceiptModal(t);
      break;
    }
    case 'edit-transaction':
      toast('Transaction editing will be available once the backend is connected.', 'info', 'Coming soon');
      break;
    case 'cancel-transaction':
      confirmDialog({
        title:'Cancel this transaction?',
        message:'Receipt ' + id + ' will be marked as cancelled. This action is recorded in the audit log.',
        confirmText:'Cancel transaction',
        onConfirm: async () => {
          await api.transactions.update(id, { status:'Cancelled' });
          toast('Transaction ' + id + ' has been cancelled.', 'warning', 'Transaction cancelled');
          navigate();
        }
      });
      break;

    /* --- Customers --- */
    case 'view-customer': openCustomerModal(id); break;
    case 'add-customer': case 'edit-customer':
      openSettingsModal('Customer Details',
        '<div class="form-grid">' +
          '<div class="field"><label>Full Name</label><input class="input" placeholder="e.g. John Kamau"></div>' +
          '<div class="field"><label>Phone</label><input class="input" placeholder="+254 7XX XXX XXX"></div>' +
          '<div class="field span-2"><label>Email</label><input class="input" placeholder="name@example.com"></div>' +
          '<div class="field"><label>Branch</label><select class="select">' + DB.branches.map(b => '<option>' + b.name + '</option>').join('') + '</select></div>' +
          '<div class="field"><label>Customer Type</label><select class="select"><option>New</option><option>Returning</option></select></div>' +
          '<div class="field span-2"><label>Notes</label><textarea class="textarea" placeholder="Preferences, account details…"></textarea></div>' +
        '</div>');
      break;

    /* --- Services --- */
    case 'add-service': case 'edit-service':
      openSettingsModal('Service Details',
        '<div class="form-grid">' +
          '<div class="field span-2"><label>Service Name</label><input class="input" placeholder="e.g. Passport Application Assistance"></div>' +
          '<div class="field"><label>Category</label><select class="select">' + DB.serviceCategories.map(c => '<option>' + c + '</option>').join('') + '</select></div>' +
          '<div class="field"><label>Tax Status</label><select class="select"><option>16% VAT</option><option>Exempt</option><option>Zero-rated</option></select></div>' +
          '<div class="field"><label>Selling Price</label><input class="input" placeholder="0"></div>' +
          '<div class="field"><label>Estimated Cost</label><input class="input" placeholder="0"></div>' +
          '<div class="field span-2"><label>Description</label><textarea class="textarea" placeholder="What does this service include?"></textarea></div>' +

/* Close modal with Escape */
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){
    closeModal();
    $$('.dropdown.open').forEach(d => d.classList.remove('open'));
  }
});

/* Global search — routes to relevant module */
document.addEventListener('keydown', (e) => {
  if(e.target && e.target.id === 'global-search' && e.key === 'Enter'){
    const q = e.target.value.trim();
    if(!q) return;
    toast('Searching for "' + q + '" across transactions, customers and services…', 'info', 'Search');
  }
});

/* ================================================================
   13. ROUTER
   ================================================================ */
function parseHash(){
  const h = location.hash.replace(/^#\/?/, '');
  return h ? h.split('/') : ['dashboard'];
}

async function navigate(){
  const route = parseHash();
  const key = route[0] || 'dashboard';

  /* Auth guard */
  if(!Session.user){
    if(key !== 'login' && key !== 'setup'){ location.hash = '#/login'; return; }
    if(key === 'setup'){ renderSetup(); return; }
    renderLogin();
    return;
  }
  if(key === 'login'){ location.hash = '#/dashboard'; return; }

  /* Shell must exist */
  if(!$('#content')) renderAppShell();

  /* Role guard */
  const allowed = navForRole(currentRole());
  const page = PAGES[key];
  const content = $('#content');

  if(!page || (!allowed.includes(key) && key !== 'dashboard')){
    content.innerHTML = pageHead('Access restricted', 'Your current role does not have permission to view this module.') +
      emptyState('Access restricted', 'Contact your administrator if you believe you should have access to this area.', 'lock');
    updateNavActive('');
    return;
  }

  content.innerHTML = loadingBlock(7);

  try {
    const html = await page.render(route.slice(1));
    content.innerHTML = html;
    if(page.mount) page.mount(route.slice(1));
    updateNavActive(key);
    document.title = page.title + ' · Robotech Digital Solutions';
    window.scrollTo({ top:0, behavior:'instant' });
  } catch(err){
    console.error(err);
    content.innerHTML = pageHead('Something went wrong', 'The module could not be loaded.') +
      emptyState('Unable to load data', 'Please refresh the page or try again. If the problem persists, contact your system administrator.', 'alert-triangle');
  }

  /* Re-bind printer tab handler after navigation */
  const tabs = $('#printer-tabs');
  if(tabs){
    tabs.addEventListener('click', async (e) => {
      const btn = e.target.closest('.tab');
      if(!btn) return;
      $$('#printer-tabs .tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      const id = parseHash()[1];
      const p = await api.printers.retrieve(id);
      const jobs = DB.printJobs.filter(j => j.printer === p.name);
      $('#printer-tab-body').innerHTML = printerTabContent(Number(btn.dataset.tab), p, jobs);
    });
  }

  /* Close mobile nav after navigation */
  if(Session.mobileNavOpen){
    Session.mobileNavOpen = false;
    document.body.classList.remove('nav-open');
  }
}

/* Mobile menu button visibility */
function syncResponsive(){
  const mBtn = $('#mobile-menu-btn');
  const dBtn = $('[data-action="toggle-sidebar"]');
  if(!mBtn || !dBtn) return;
  const isMobile = window.innerWidth <= 1024;
  mBtn.style.display = isMobile ? 'inline-flex' : 'none';
  dBtn.style.display = isMobile ? 'none' : 'inline-flex';
}
window.addEventListener('resize', syncResponsive);
window.addEventListener('hashchange', () => { navigate(); syncResponsive(); });

/* ================================================================
   14. BOOTSTRAP
   ================================================================ */
(function init(){
  /* Restore collapsed sidebar preference */
  try {
    const saved = localStorage.getItem('robotech.sidebar');
    if(saved !== null) Session.sidebarCollapsed = saved === '1';
  } catch(e){ /* ignore */ }

  if(!location.hash) location.hash = '#/login';
  navigate();
  syncResponsive();

  /* Persist sidebar preference */
  const observer = new MutationObserver(() => {
    try { localStorage.setItem('robotech.sidebar', Session.sidebarCollapsed ? '1' : '0'); } catch(e){}
  });
  observer.observe(document.body, { attributes:true, attributeFilter:['class'] });

  console.log('%cROBOTECH DIGITAL SOLUTIONS', 'color:#174EA6;font-weight:800;font-size:14px');
  console.log('%cBusiness Management & Operations System ' + APP.version, 'color:#7A889E');
  console.log('Frontend demo mode: ' + (USE_MOCK ? 'ON (mock data)' : 'OFF (live API at ' + API_BASE + ')'));
  console.log('Founder: ' + APP.founder + ' · ' + APP.website);
})();
